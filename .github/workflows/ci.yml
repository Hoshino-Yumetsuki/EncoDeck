# SPDX-License-Identifier: GPL-3.0-only
name: CI

on:
  push:
    branches: [main, "dev/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore EncoDeck.slnx

      - name: Build libraries, Probe and tests
        run: dotnet build EncoDeck.slnx -c Release --no-restore

      - name: Build app (x64)
        run: dotnet build src/EncoDeck.App -c Release -p:Platform=x64

      - name: Test
        run: dotnet test tests/EncoDeck.Tests -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  package:
    needs: build-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish app (win-x64, self-contained, unpackaged)
        shell: pwsh
        run: |
          $suffix = if ($env:GITHUB_REF_TYPE -eq 'tag') { '' } else { "ci.$env:GITHUB_RUN_NUMBER" }
          dotnet publish src/EncoDeck.App -c Release -r win-x64 -p:Platform=x64 -p:VersionSuffix=$suffix -o artifacts/EncoDeck-win-x64
          dotnet publish tools/EncoDeck.Probe -c Release -r win-x64 --self-contained -p:VersionSuffix=$suffix -o artifacts/EncoDeck.Probe-win-x64
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, README.md, README_EN.md artifacts/EncoDeck-win-x64/
          Copy-Item LICENSE artifacts/EncoDeck.Probe-win-x64/
          foreach ($f in 'EncoDeck.exe', 'EncoDeck.pri', 'Microsoft.WindowsAppRuntime.dll', 'Microsoft.ui.xaml.dll') {
            if (-not (Test-Path "artifacts/EncoDeck-win-x64/$f")) { throw "Missing $f in publish output" }
          }
          Compress-Archive artifacts/EncoDeck-win-x64/* artifacts/EncoDeck-win-x64.zip
          Compress-Archive artifacts/EncoDeck.Probe-win-x64/* artifacts/EncoDeck.Probe-win-x64.zip

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $props = Get-Content Directory.Build.props -Raw
          $prefix = [regex]::Match($props, '<VersionPrefix>([^<]+)</VersionPrefix>').Groups[1].Value
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "$prefix-ci.$env:GITHUB_RUN_NUMBER" }
          ./build/build-installer.ps1 -SkipTests -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: EncoDeck-win-x64
          path: |
            artifacts/EncoDeck-win-x64.zip
            artifacts/EncoDeck.Probe-win-x64.zip
            artifacts/installer/*.exe
            artifacts/installer/*.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EncoDeck-win-x64
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            EncoDeck-win-x64.zip
            EncoDeck.Probe-win-x64.zip
            installer/*.exe
            installer/*.sha256

  # Microsoft Store: build the MSIX bundle and submit it to Partner Center (certification + publish).
  # Uses build/submit-store.ps1 (Partner Center submission API). Needs the STORE_* secrets from a Microsoft Entra app added in Partner Center (Account settings →
  # User management → Microsoft Entra applications, role Manager). Without them the job is skipped.
  # Also runnable by hand (Actions → CI → Run workflow) to resubmit the version in Directory.Build.props.
  store:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build-test
    runs-on: windows-latest
    env:
      STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4
        if: env.STORE_TENANT_ID != ''

      - uses: actions/setup-dotnet@v4
        if: env.STORE_TENANT_ID != ''
        with:
          global-json-file: global.json

      - name: Build Store package
        if: env.STORE_TENANT_ID != ''
        shell: pwsh
        run: |
          dotnet restore src/EncoDeck.App
          $props = Get-Content Directory.Build.props -Raw
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { [regex]::Match($props, '<VersionPrefix>([^<]+)</VersionPrefix>').Groups[1].Value }
          ./build/build-msix.ps1 -SkipTests -Version $version
          # Keep the upload apart from the build output.
          New-Item -ItemType Directory -Force artifacts/store | Out-Null
          Move-Item artifacts/*.msixupload artifacts/store/

      - name: Submit to Microsoft Store
        if: env.STORE_TENANT_ID != ''
        shell: pwsh
        env:
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        run: |
          $version = [regex]::Match((Get-Content Directory.Build.props -Raw), '<VersionPrefix>([^<]+)</VersionPrefix>').Groups[1].Value
          $pattern = '(?ms)^## \[' + [regex]::Escape($version) + '\][^\r\n]*\r?\n(.*?)(?=^## |\z)'
          $notes = [regex]::Match((Get-Content CHANGELOG.md -Raw), $pattern).Groups[1].Value.Trim()
          if (-not $notes) { throw "Release notes missing for $version." }
          ./build/submit-store.ps1 -Package (Get-ChildItem artifacts/store/*.msixupload | Select-Object -First 1).FullName -ReleaseNotes $notes

      - uses: actions/upload-artifact@v4
        if: env.STORE_TENANT_ID != ''
        with:
          name: EncoDeck-msixupload
          path: artifacts/store/*.msixupload
