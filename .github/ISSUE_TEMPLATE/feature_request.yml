name: 功能建议 / Feature request
description: 建议新功能或改进现有功能 / Suggest a new feature or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / Problem
      description: 你在什么场景下遇到了不便？ / What are you trying to do, and what gets in the way?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案 / Proposed solution
      description: 你希望 EncoDeck 怎样做？ / How would you like EncoDeck to handle it?
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 相关耳机型号 / Related earbud model
      description: 如果建议只与某款耳机有关 / If the request is specific to a model

  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案或补充 / Alternatives and context
      description: 考虑过的替代方案、截图或参考 / Alternatives considered, screenshots or references
